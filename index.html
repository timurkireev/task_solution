<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<style>
  .app {
    width: min(1200px, 100vw);
  }

  canvas {
    width: 100%;
    height: 100%;
  }
</style>

<body>
  <main class="app">
    <label class="checkbox">
      <input id="gravity" type="checkbox">
      <span>Гравитация</span>
    </label>
    <canvas id="canvas"></canvas>
  </main>

  <script type="module">

    const canvas = document.querySelector("#canvas");
    const gravityCheckbox = document.querySelector("#gravity");

    const N = 50;
    const GRID_SIZE = 3.0;
    const DT = 0.08;
    const ITERS = 20;

    function vertexIndex(x, y) {
      return y * (N + 1) + x;
    }

    const VERTEX_COUNT = (N + 1) * (N + 1);
    const neighborLists = new Uint32Array(VERTEX_COUNT * 8);
    const neighborCounts = new Uint32Array(VERTEX_COUNT);

    for (let y = 0; y <= N; ++y) {
      for (let x = 0; x <= N; ++x) {
        const i = vertexIndex(x, y);
        const candidates = [
          [x - 1, y], [x + 1, y],
          [x, y - 1], [x, y + 1],
          [x - 1, y - 1], [x + 1, y - 1],
          [x - 1, y + 1], [x + 1, y + 1],
        ];

        let count = 0;
        for (const [nx, ny] of candidates) {
          if (nx >= 0 && nx <= N && ny >= 0 && ny <= N) {
            neighborLists[i * 8 + count++] = vertexIndex(nx, ny);
          }
        }
        neighborCounts[i] = count;
      }
    }

    const initialPositions = new Float32Array(VERTEX_COUNT * 4);
    const initialVelocities = new Float32Array(VERTEX_COUNT * 4);
    const fixedFlags = new Uint32Array(VERTEX_COUNT); // 0 = free, 1 = fixed

    for (let y = 0; y <= N; ++y) {
      for (let x = 0; x <= N; ++x) {
        const i = vertexIndex(x, y);

        // x = horizontal, z = vertical axis
        const px = (x / N - 0.5) * GRID_SIZE;
        const py = 0.35;
        const pz = (y / N - 0.5) * GRID_SIZE;

        initialPositions[i * 4 + 0] = px;
        initialPositions[i * 4 + 1] = py;
        initialPositions[i * 4 + 2] = pz;

        const corner =
          (x === 0 || x === N) &&
          (y === 0 || y === N);

        fixedFlags[i] = corner ? 1 : 0;
      }
    }


    function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function normalize(v) {
      const l = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0] / l, v[1] / l, v[2] / l];
    }

    function mat4Perspective(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, (2 * far * near) * nf, 0
      ]);
    }

    function mat4LookAt(eye, target, up) {
      const z = normalize(sub(eye, target));
      const x = normalize(cross(up, z));
      const y = cross(z, x);

      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -dot(x, eye), -dot(y, eye), -dot(z, eye), 1
      ]);
    }

    function mat4Mul(a, b) {
      const out = new Float32Array(16);
      for (let c = 0; c < 4; ++c) {
        for (let r = 0; r < 4; ++r) {
          out[c * 4 + r] =
            a[0 * 4 + r] * b[c * 4 + 0] +
            a[1 * 4 + r] * b[c * 4 + 1] +
            a[2 * 4 + r] * b[c * 4 + 2] +
            a[3 * 4 + r] * b[c * 4 + 3];
        }
      }
      return out;
    }
    const projection = mat4Perspective(0.8, 2, 0.05, 20);
    const view = mat4LookAt(
      [3, 3, 3],
      [0, 0.1, 0],
      [0, 1, 0]
    );
    const viewProj = mat4Mul(projection, view);
    

    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();
    const context = canvas.getContext("webgpu");
    const format = navigator.gpu.getPreferredCanvasFormat();

    function configureCanvas() {
      const w = canvas.clientWidth * devicePixelRatio;
      const h = canvas.clientHeight * devicePixelRatio;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      context.configure({
        device,
        format,
        alphaMode: "opaque"
      });
    }
    configureCanvas();
    addEventListener("resize", configureCanvas);

    function saveBuffer(data) {
      const buffer = device.createBuffer({
        size: data.byteLength,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
      });
      device.queue.writeBuffer(buffer, 0, data);
      return buffer;
    }

    const positionsBuffer = saveBuffer(initialPositions);
    const oldPositionsBuffer = saveBuffer(initialPositions);
    const newPositionsBuffer = saveBuffer(initialPositions);
    const velocityBuffer = saveBuffer(initialVelocities);
    const neighborsBuffer = saveBuffer(neighborLists);
    const countsBuffer = saveBuffer(neighborCounts);
    const flagsBuffer = saveBuffer(fixedFlags);

    const lineIndices = [];
    for (let y = 0; y < N; ++y) {
      for (let x = 0; x < N; ++x) {
        const a = vertexIndex(x, y);
        const b = vertexIndex(x + 1, y);
        const c = vertexIndex(x, y + 1);
        const d = vertexIndex(x + 1, y + 1);

        lineIndices.push(a, b, b, d, d, a);
        lineIndices.push(a, c, c, d, d, a);
      }
    }
    const lineIndexBuffer = device.createBuffer({
      size: lineIndices.length * 4,
      usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST
    });
    device.queue.writeBuffer(lineIndexBuffer, 0, new Uint32Array(lineIndices));

    const uniformBuffer = device.createBuffer({
      size: 64,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    const computeShader = device.createShaderModule({
      code:
        `
        struct Params {
          dt: f32,
          time: f32,
          edgeLen: f32,
          N: u32,
          vertexCount: u32,
          gravityEnabled: u32
        };

        @group(0) @binding(0) var<storage, read_write> pos: array<vec3<f32>>;
        @group(0) @binding(1) var<storage, read_write> oldPos: array<vec3<f32>>;
        @group(0) @binding(2) var<storage, read_write> newPos: array<vec3<f32>>;
        @group(0) @binding(3) var<storage, read_write> vel: array<vec3<f32>>;
        @group(0) @binding(4) var<storage, read_write> neighbors: array<u32>;
        @group(0) @binding(5) var<storage, read_write> neighborCounts: array<u32>;
        @group(0) @binding(6) var<storage, read_write> isFixed: array<u32>;
        @group(0) @binding(7) var<uniform> p: Params;

        fn isCentralVertex(i: u32) -> bool {
          return i == (p.N / 2) * (p.N + 1) + (p.N / 2);
        }

        @compute @workgroup_size(64)
        fn calcInitialPositions(@builtin(global_invocation_id) gid: vec3<u32>) {
          let i = gid.x;
          if (i >= p.vertexCount) { return; }

          if (isFixed[i] != 0) {
            oldPos[i] = pos[i];
            newPos[i] = pos[i];
            vel[i] = vec3<f32>(0.0);
            return;
          }

          if (isCentralVertex(i)) {
            let targetY = 0.35 + 0.25 * sin(p.time);
            pos[i] = vec3<f32>(pos[i].x, targetY, pos[i].z);
            oldPos[i] = pos[i];
            newPos[i] = pos[i];
            vel[i] = vec3<f32>(0.0);
            return;
          }

          var g = vec3<f32>(0, 0, 0);
          if (p.gravityEnabled != 0) { g.y = -0.1; }
          vel[i] = 0.99 * (vel[i] + g * p.dt);

          oldPos[i] = pos[i];
          newPos[i] = pos[i] + vel[i] * p.dt;
        }

        @compute @workgroup_size(64)
        fn solveConstraints(@builtin(global_invocation_id) gid: vec3<u32>) {
          let i = gid.x;
          if (i >= p.vertexCount) { return; }

          if (isFixed[i] != 0 || isCentralVertex(i)) { return; }

          var correction = vec3<f32>(0.0);
          var count = 0.0;

          for (var k: u32 = 0; k < 8; k = k + 1) {
            if (k >= neighborCounts[i]) { break; }

            let j = neighbors[i * 8 + k];
            let d = pos[i] - pos[j];
            let len = length(d);
            if (len < 1e-6) { continue; }

            let ix = i % (p.N + 1);
            let iy = i / (p.N + 1);
            let jx = j % (p.N + 1);
            let jy = j / (p.N + 1);
            let isDiagonal = (ix != jx) && (iy != jy);

            var edgeLen = p.edgeLen; 
            if (isDiagonal) { edgeLen = sqrt(2) * p.edgeLen; }
            let stiffness = 0.9;
            correction += (-0.5 * stiffness * (len - edgeLen)) * (d / len);
            count += 1;
          }

          if (count > 0) { correction /= count; }

          newPos[i] += correction;
        }

        @compute @workgroup_size(64)
        fn applyPositions(@builtin(global_invocation_id) gid: vec3<u32>) {
          let i = gid.x;
          if (i >= p.vertexCount) { return; }

          if (isFixed[i] != 0 || isCentralVertex(i)) { return; }
          
          pos[i] = newPos[i];
        }

        @compute @workgroup_size(64)
        fn applyVelocity(@builtin(global_invocation_id) gid: vec3<u32>) {
          let i = gid.x;
          if (i >= p.vertexCount) { return; }

          if (isFixed[i] != 0 || isCentralVertex(i)) { return; }
          
          vel[i] = (newPos[i] - oldPos[i]) / p.dt;
        }

        `
    });

    const computeBindGroupLayout = device.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        { binding: 5, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        { binding: 6, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        { binding: 7, visibility: GPUShaderStage.COMPUTE, buffer: { type: "uniform" } },
      ]
    });

    const computePipelineLayout = device.createPipelineLayout({
      bindGroupLayouts: [computeBindGroupLayout]
    });

    const calcInitialPositionsPipeline = device.createComputePipeline({
      layout: computePipelineLayout,
      compute: {
        module: computeShader,
        entryPoint: "calcInitialPositions"
      }
    });

    const solveConstraintsPipeline = device.createComputePipeline({
      layout: computePipelineLayout,
      compute: {
        module: computeShader,
        entryPoint: "solveConstraints"
      }
    });

    const applyPositionsPipeline = device.createComputePipeline({
      layout: computePipelineLayout,
      compute: {
        module: computeShader,
        entryPoint: "applyPositions"
      }
    });
    
    const applyVelocityPipeline = device.createComputePipeline({
      layout: computePipelineLayout,
      compute: {
        module: computeShader,
        entryPoint: "applyVelocity"
      }
    });

    const computeBindGroup = device.createBindGroup({
      layout: computeBindGroupLayout,
      entries: [
        { binding: 0, resource: { buffer: positionsBuffer } },
        { binding: 1, resource: { buffer: oldPositionsBuffer } },
        { binding: 2, resource: { buffer: newPositionsBuffer } },
        { binding: 3, resource: { buffer: velocityBuffer } },
        { binding: 4, resource: { buffer: neighborsBuffer } },
        { binding: 5, resource: { buffer: countsBuffer } },
        { binding: 6, resource: { buffer: flagsBuffer } },
        { binding: 7, resource: { buffer: uniformBuffer } },
      ]
    });

    const renderShader = device.createShaderModule({
      code:
        `
        struct Camera {
          viewProj: mat4x4<f32>,
        };

        @group(0) @binding(0) var<storage, read> pos: array<vec3<f32>>;
        @group(0) @binding(1) var<uniform> camera: Camera;

        struct VSOut {
          @builtin(position) position: vec4<f32>,
          @location(0) color: vec4<f32>,
        };

        @vertex
        fn vs(
          @builtin(vertex_index) index: u32,
        ) -> VSOut {
          var out: VSOut;
          out.position = camera.viewProj * vec4<f32>(pos[index], 1.0);
          out.color = vec4<f32>(1, 1, 1, 1);
          return out;
        }

        @fragment
        fn fs(in: VSOut) -> @location(0) vec4<f32> {
          return in.color;
        }
        `
    });

    const cameraBuffer = device.createBuffer({
      size: 64,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    const renderBindGroupLayout = device.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
        { binding: 1, visibility: GPUShaderStage.VERTEX, buffer: { type: "uniform" } },
      ]
    });

    const renderBindGroup = device.createBindGroup({
      layout: renderBindGroupLayout,
      entries: [
        { binding: 0, resource: { buffer: positionsBuffer } },
        { binding: 1, resource: { buffer: cameraBuffer } },
      ]
    });

    const renderPipeline = device.createRenderPipeline({
      layout: device.createPipelineLayout({
        bindGroupLayouts: [renderBindGroupLayout]
      }),
      vertex: {
        module: renderShader,
        entryPoint: "vs",
        buffers: []
      },
      fragment: {
        module: renderShader,
        entryPoint: "fs",
        targets: [{ format }]
      },
      primitive: {
        topology: "line-list"
      }
    });

    function writeParams(simTime, gravityEnabled) {
      const data = new ArrayBuffer(6*4);
      const f = new Float32Array(data);
      const u = new Uint32Array(data);

      f[0] = DT;
      f[1] = simTime;
      f[2] = GRID_SIZE / N;
      u[3] = N;
      u[4] = VERTEX_COUNT;
      u[5] = gravityEnabled;

      device.queue.writeBuffer(uniformBuffer, 0, data);
    }

    function simulateStep(simTime, gravityEnabled) {
      
      writeParams(simTime, gravityEnabled);

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginComputePass();

      pass.setBindGroup(0, computeBindGroup);

      pass.setPipeline(calcInitialPositionsPipeline);
      pass.dispatchWorkgroups(Math.ceil(VERTEX_COUNT / 64));

      for (let i = 0; i < ITERS; ++i) {
        pass.setPipeline(solveConstraintsPipeline);
        pass.dispatchWorkgroups(Math.ceil(VERTEX_COUNT / 64));

        pass.setPipeline(applyPositionsPipeline);
        pass.dispatchWorkgroups(Math.ceil(VERTEX_COUNT / 64));
      }
      
      pass.setPipeline(applyVelocityPipeline);
      pass.dispatchWorkgroups(Math.ceil(VERTEX_COUNT / 64));

      pass.end();
      device.queue.submit([encoder.finish()]);
    }

    function render() {
      
      device.queue.writeBuffer(cameraBuffer, 0, viewProj);

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: { r: 0.035, g: 0.045, b: 0.06, a: 1 },
          loadOp: "clear",
          storeOp: "store"
        }]
      });

      pass.setPipeline(renderPipeline);
      pass.setBindGroup(0, renderBindGroup);
      pass.setIndexBuffer(lineIndexBuffer, "uint32");
      pass.drawIndexed(lineIndices.length);
      pass.end();

      device.queue.submit([encoder.finish()]);
    }

    let time = 0;
    function frame(now) {

      time += DT;
      simulateStep(time, gravityCheckbox.checked);
      render();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);

  </script>
</body>

</html>
